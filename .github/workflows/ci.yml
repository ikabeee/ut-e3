name: CI

# Puerta de calidad: todo PR hacia develop o main debe pasar lint (ESLint con las reglas
# de SonarQube y Oxlint con las reglas anti-slop y readable-code), código duplicado (jscpd), formato (Prettier), typecheck, pruebas, migraciones de la base y build.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      DO_NOT_TRACK: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run lint:oxlint
      - run: npm run lint:duplication
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run build
        env:
          # Obligatoria en producción (src/shared/lib/env.ts); basta un valor de ejemplo.
          NEXT_PUBLIC_SITE_URL: https://example.com
