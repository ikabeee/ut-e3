name: Nueva funcionalidad
description: Propón algo nuevo para la plataforma del evento.
title: "[Feature]: "
labels: ["feature", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ¿Tienes una idea para la plataforma? ¡Cuéntanos!
        Piensa en **qué problema resuelve** antes de pensar en **cómo** se implementa.

  - type: textarea
    id: problem
    attributes:
      label: Problema u oportunidad
      description: ¿Qué necesidad tienen los visitantes, equipos u organizadores?
      placeholder: Como visitante del evento quiero ... para ...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Solución propuesta
      description: Describe cómo funcionaría. Bocetos y referencias son bienvenidos.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Criterios de aceptación
      description: Lista verificable de lo que debe cumplirse para darla por terminada.
      placeholder: |
        - [ ] El visitante puede ...
        - [ ] Se muestra ...
    validations:
      required: true

  - type: input
    id: feature-area
    attributes:
      label: Feature (screaming architecture)
      description: ¿A qué feature de src/features/ pertenece? Si no encaja en ninguna, propón el nombre (en inglés) de una feature nueva.
      placeholder: example, shared, base de datos...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: ¿Qué otras soluciones pensaste y por qué las descartaste?

  - type: checkboxes
    id: checklist
    attributes:
      label: Antes de enviar
      options:
        - label: Busqué en los issues existentes y no encontré una propuesta igual.
          required: true
        - label: Me gustaría trabajar en esta funcionalidad.
