name: Reporte de bug
description: Algo no funciona como debería en la plataforma.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por tomarte el tiempo de reportar un problema!
        Antes de continuar, busca en los [issues existentes](../issues?q=is%3Aissue) para evitar duplicados.

  - type: dropdown
    id: modulo
    attributes:
      label: Módulo afectado
      description: ¿En qué parte de la aplicación ocurre el problema?
      options:
        - games (catálogo de videojuegos)
        - teams (equipos / desarrolladores)
        - showcase (evento, agenda y stands)
        - shared (componentes, estilos, layout)
        - Base de datos / Prisma
        - Infraestructura / despliegue
        - No estoy seguro
    validations:
      required: true

  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del bug
      description: Explica de forma clara y concisa qué está fallando.
      placeholder: Al abrir el detalle de un videojuego la página se queda en blanco...
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Enumera los pasos exactos para que alguien más pueda ver el error.
      placeholder: |
        1. Ir a '/games'
        2. Dar clic en '...'
        3. Hacer scroll hasta '...'
        4. Ver el error
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
      description: ¿Qué debería haber pasado?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
      description: ¿Qué pasó en realidad? Incluye mensajes de error si los hay.
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Capturas de pantalla o logs
      description: Arrastra imágenes aquí o pega logs de la consola/terminal.
      render: shell

  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options:
        - Local (npm run dev)
        - Preview / staging
        - Producción
    validations:
      required: true

  - type: input
    id: navegador
    attributes:
      label: Navegador y sistema operativo
      placeholder: Chrome 140 en Windows 11

  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options:
        - Crítica (bloquea el evento o la app no carga)
        - Alta (una funcionalidad principal no sirve)
        - Media (hay un rodeo posible)
        - Baja (detalle visual o menor)
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Antes de enviar
      options:
        - label: Busqué en los issues existentes y no encontré uno igual.
          required: true
        - label: Me gustaría intentar resolver este bug.
