# PostgreSQL para desarrollo local. Guía completa en docs/data-sources.md.
#
# Sólo la base (para `npm run dev`):   docker compose up -d --wait db
# Detener el contenedor:               docker compose down
#
# Las variables se pueden cambiar en `.env` (ver .env.example).

name: ut-game-showcase

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
